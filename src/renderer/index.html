<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self';" />
  <title>Hanmar Chat Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Loading -->
  <section id="view-loading" class="screen">
    <p>Memuat…</p>
  </section>

  <!-- Offline / error -->
  <section id="view-offline" class="screen hidden">
    <div class="card" style="text-align:center">
      <p class="wordmark">Hanmar Chat Hub</p>
      <p id="offline-message" class="hint" style="margin-bottom:16px"></p>
      <button class="primary" id="retry-btn">Coba Lagi</button>
    </div>
  </section>

  <!-- Login / Register -->
  <section id="view-auth" class="screen hidden">
    <div class="card">
      <p class="wordmark">Hanmar Chat Hub</p>
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Masuk</button>
        <button class="tab-btn" data-tab="register">Daftar (Trial 3 Hari)</button>
      </div>

      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <p class="error-text" id="login-error"></p>
        <button type="submit" class="primary">Masuk</button>
      </form>

      <form id="register-form" class="hidden">
        <input type="text" name="name" placeholder="Nama pemilik usaha" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password (min. 8 karakter)" required minlength="8" />
        <p class="error-text" id="register-error"></p>
        <button type="submit" class="primary">Mulai Trial 3 Hari</button>
      </form>

      <p class="hint">Device ini akan otomatis terkunci ke akun Anda (1 akun = 1 device).</p>
    </div>
  </section>

  <!-- Locked (trial/langganan habis) -->
  <section id="view-locked" class="screen hidden">
    <div class="card" style="text-align:center">
      <div class="locked-icon">🔒</div>
      <p class="wordmark">Akses Terkunci</p>
      <p class="hint" id="locked-message" style="margin-bottom:16px"></p>
      <p class="hint">Perpanjang dengan transfer manual lalu hubungi admin untuk approve.</p>
      <button class="primary" id="locked-logout-btn" style="margin-top:16px">Keluar Akun</button>
    </div>
  </section>

  <!-- Main (aktif) -->
  <section id="view-main" class="screen main-shell hidden">
    <div class="topbar">
      <p class="wordmark">Hanmar Chat Hub</p>
      <div style="display:flex; align-items:center; gap:12px">
        <span style="font-size:13px; opacity:0.85">👋 <span id="user-name"></span></span>
        <span class="badge" id="status-badge"></span>
        <button class="logout-btn" id="main-logout-btn">Keluar</button>
      </div>
    </div>
    <div class="main-body">
      <nav class="channel-nav">
        <div class="channel-nav-list" id="channel-nav-list"></div>
        <button class="channel-add-btn" id="channel-add-btn" title="Tambah akun WhatsApp/Telegram">+</button>
        <div class="channel-nav-soon">
          <button class="channel-btn" disabled title="Menyusul — perlu App Review Meta">Messenger <span class="soon">Segera</span></button>
          <button class="channel-btn" disabled title="Menyusul — perlu App Review Meta">Instagram DM <span class="soon">Segera</span></button>
          <button class="channel-btn" disabled title="Menyusul — perlu registrasi Shopee Open Platform (whitelist Chat API)">Shopee <span class="soon">Segera</span></button>
          <button class="channel-btn" disabled title="Menyusul — perlu registrasi Tokopedia Developer">Tokopedia <span class="soon">Segera</span></button>
        </div>
      </nav>

      <div class="channel-content" id="channel-content"></div>
    </div>
  </section>

  <!-- Template pane WhatsApp: di-clone tiap kali akun WA baru dibuat -->
  <template id="wa-account-template">
    <div class="channel-pane hidden" data-pane>
      <div class="wa-pairing" data-pairing>
        <div data-pairing-connecting>
          <p class="hint">Menyambungkan WhatsApp…</p>
        </div>
        <div class="hidden" data-pairing-qr>
          <p class="hint" style="margin-bottom:12px">Buka WhatsApp di HP → <b>Perangkat Tertaut</b> → <b>Tautkan Perangkat</b>, lalu scan kode ini:</p>
          <img data-qr-img alt="QR WhatsApp" width="240" height="240" />
        </div>
        <div class="hidden" data-pairing-reconnecting>
          <p class="hint">Koneksi WhatsApp terputus, mencoba menyambung ulang…</p>
        </div>
      </div>

      <div class="wa-connected hidden" data-connected>
        <aside class="wa-chatlist">
          <div class="chatlist-toolbar">
            <input type="search" class="chatlist-search" data-search placeholder="Cari chat…" />
            <div class="chatlist-filters">
              <button type="button" class="filter-chip active" data-filter="all">Semua</button>
              <button type="button" class="filter-chip" data-filter="unread">Belum dibaca</button>
              <button type="button" class="filter-chip" data-filter="group">Grup</button>
            </div>
          </div>
          <div class="chatlist-items" data-chatlist>
            <p class="wa-chatlist-empty" data-chatlist-empty>Belum ada chat masuk.</p>
          </div>
        </aside>
        <div class="wa-thread">
          <div class="wa-thread-header" data-thread-header>Pilih chat di sebelah kiri</div>
          <div class="wa-messages" data-messages></div>
          <form class="wa-send-form hidden" data-send-form>
            <input type="text" data-message-input placeholder="Tulis pesan…" autocomplete="off" />
            <button type="submit" class="primary">Kirim</button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <!-- Template pane Telegram: di-clone tiap kali akun bot baru dibuat -->
  <template id="tg-account-template">
    <div class="channel-pane hidden" data-pane>
      <div class="wa-pairing" data-setup>
        <p class="hint" style="max-width:420px; margin-bottom:16px">
          Belum terhubung ke Telegram. Buat bot lewat <b>@BotFather</b> di Telegram (perintah <code>/newbot</code>), lalu tempel token-nya di sini:
        </p>
        <form style="display:flex; gap:8px;" data-token-form>
          <input type="text" data-token-input placeholder="Token Bot Telegram" style="width:320px;" required />
          <button type="submit" class="primary">Hubungkan</button>
        </form>
        <p class="error-text" data-token-error></p>
      </div>

      <div class="wa-connected hidden" data-connected>
        <aside class="wa-chatlist">
          <div class="chatlist-toolbar">
            <input type="search" class="chatlist-search" data-search placeholder="Cari chat…" />
            <div class="chatlist-filters">
              <button type="button" class="filter-chip active" data-filter="all">Semua</button>
              <button type="button" class="filter-chip" data-filter="unread">Belum dibaca</button>
              <button type="button" class="filter-chip" data-filter="group">Grup</button>
            </div>
          </div>
          <div class="chatlist-items" data-chatlist>
            <p class="wa-chatlist-empty" data-chatlist-empty>Belum ada chat masuk. Chat bot Anda dulu di Telegram.</p>
          </div>
        </aside>
        <div class="wa-thread">
          <div class="wa-thread-header" data-thread-header>Pilih chat di sebelah kiri</div>
          <div class="wa-messages" data-messages></div>
          <form class="wa-send-form hidden" data-send-form>
            <input type="text" data-message-input placeholder="Tulis pesan…" autocomplete="off" />
            <button type="submit" class="primary">Kirim</button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
