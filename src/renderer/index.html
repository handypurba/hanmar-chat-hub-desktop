<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self';" />
  <title>Hanmar Chat Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Loading -->
  <section id="view-loading" class="screen">
    <p>Memuat…</p>
  </section>

  <!-- Offline / error -->
  <section id="view-offline" class="screen hidden">
    <div class="card" style="text-align:center">
      <p class="wordmark">Hanmar Chat Hub</p>
      <p id="offline-message" class="hint" style="margin-bottom:16px"></p>
      <button class="primary" id="retry-btn">Coba Lagi</button>
    </div>
  </section>

  <!-- Login / Register -->
  <section id="view-auth" class="screen hidden">
    <div class="card">
      <p class="wordmark">Hanmar Chat Hub</p>
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Masuk</button>
        <button class="tab-btn" data-tab="register">Daftar (Trial 3 Hari)</button>
      </div>

      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required />
        <div class="password-field">
          <input type="password" name="password" placeholder="Password" required />
          <button type="button" class="password-toggle" data-toggle-password aria-label="Tampilkan password">
            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18" />
              <path d="M10.6 5.1c.45-.07.92-.1 1.4-.1 7 0 10.5 7 10.5 7a15.8 15.8 0 0 1-3.4 4.3M6.7 6.7C3.6 8.6 1.5 12 1.5 12s3.5 7 10.5 7c1.5 0 2.9-.32 4.1-.86" />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
            </svg>
          </button>
        </div>
        <p class="error-text" id="login-error"></p>
        <button type="submit" class="primary">Masuk</button>
      </form>

      <form id="register-form" class="hidden">
        <input type="text" name="name" placeholder="Nama pemilik usaha" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="tel" name="phone" placeholder="Nomor HP/WhatsApp aktif" required />
        <div class="password-field">
          <input type="password" name="password" placeholder="Password (min. 8 karakter)" required minlength="8" />
          <button type="button" class="password-toggle" data-toggle-password aria-label="Tampilkan password">
            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18" />
              <path d="M10.6 5.1c.45-.07.92-.1 1.4-.1 7 0 10.5 7 10.5 7a15.8 15.8 0 0 1-3.4 4.3M6.7 6.7C3.6 8.6 1.5 12 1.5 12s3.5 7 10.5 7c1.5 0 2.9-.32 4.1-.86" />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
            </svg>
          </button>
        </div>
        <p class="error-text" id="register-error"></p>
        <button type="submit" class="primary">Mulai Trial 3 Hari</button>
      </form>

      <p class="hint">Device ini akan otomatis terkunci ke akun Anda (1 akun = 1 device).</p>
    </div>
  </section>

  <!-- Locked (trial/langganan habis) -->
  <section id="view-locked" class="screen hidden">
    <div class="card" style="text-align:center">
      <div class="locked-icon">🔒</div>
      <p class="wordmark">Akses Terkunci</p>
      <p class="hint" id="locked-message" style="margin-bottom:16px"></p>
      <p class="hint">Perpanjang dengan transfer manual lalu hubungi admin untuk approve.</p>
      <button class="primary" id="locked-logout-btn" style="margin-top:16px">Keluar Akun</button>
    </div>
  </section>

  <!-- Main (aktif) -->
  <section id="view-main" class="screen main-shell hidden">
    <div class="topbar">
      <p class="wordmark">Hanmar Chat Hub</p>
      <div style="display:flex; align-items:center; gap:12px">
        <span style="font-size:13px; opacity:0.85">👋 <span id="user-name"></span></span>
        <span class="badge" id="status-badge"></span>
        <a class="reports-btn" href="https://wa.me/6285158886023" target="_blank" rel="noopener" title="Ada kendala? Chat kami di WhatsApp">💬 Bantuan</a>
        <button class="logout-btn" id="main-logout-btn">Keluar</button>
      </div>
    </div>
    <div class="main-body">
      <nav class="channel-nav">
        <div class="channel-nav-list" id="channel-nav-list"></div>
        <button class="channel-add-btn" id="channel-add-btn" title="Tambah akun channel baru">+</button>
      </nav>

      <div class="channel-content" id="channel-content"></div>
    </div>
  </section>

  <!-- Dialog rename custom — Electron TIDAK mendukung window.prompt() bawaan
       browser, jadi rename akun (ikon ✎ di sidebar) pakai ini, bukan prompt(). -->
  <div id="rename-dialog" class="modal-overlay hidden">
    <div class="modal-card">
      <p class="modal-title">Ganti nama akun</p>
      <form id="rename-form">
        <input type="text" id="rename-input" maxlength="60" required />
        <div class="modal-actions">
          <button type="button" class="btn-ghost-sm" id="rename-cancel">Batal</button>
          <button type="submit" class="primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Template pane akun (WhatsApp & Telegram sama-sama embed web resmi) —
       cuma placeholder kosong, isinya WebContentsView (WA Web/Telegram Web
       asli) yang ditumpuk pas di atas area ini oleh main process, posisinya
       dilaporkan lewat ResizeObserver (lihat renderer.js). -->
  <template id="web-embed-account-template">
    <div class="channel-pane hidden wa-web-pane" data-pane>
      <p class="hint" data-loading-text>Memuat…</p>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
